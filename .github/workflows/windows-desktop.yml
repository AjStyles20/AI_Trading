name: Windows desktop bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'core/**'
      - 'database/**'
      - 'frontend/**'
      - 'scripts/build_windows_backend.ps1'
      - 'scripts/smoke_windows_backend.ps1'
      - 'scripts/smoke_windows_desktop.ps1'
      - '.github/workflows/windows-desktop.yml'

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/build_windows_backend.ps1
        shell: pwsh
      - run: ./scripts/smoke_windows_backend.ps1
        shell: pwsh
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run electron:build
        working-directory: frontend
      - run: ./scripts/smoke_windows_desktop.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: astral-windows-installer
          path: frontend/release/*.exe
          if-no-files-found: error
          retention-days: 7
